name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/saloni-prototype-dev-idl8tr]
  # Lets the site be redeployed by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pages must be switched on once by an admin under
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # The workflow token is not permitted to create the site itself.
      - uses: actions/configure-pages@v5

      - run: npm ci

      # Runs `tsc -b` before `vite build`, so a type error fails the deploy.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
